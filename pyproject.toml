[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opencop"
version = "0.1.0"
description = "An open-data common operating picture: air, sea and drone tracks."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "zstandard>=0.22",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
analytics = ["pandas>=2.2", "matplotlib>=3.8"]
live = ["websockets>=12"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "mypy>=1.10", "ruff>=0.4"]

[project.scripts]
opencop = "opencop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running tests", "network: tests that call real APIs (skipped by default)"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["zstandard", "pandas", "matplotlib.*", "websockets"]
ignore_missing_imports = true

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]